services:
  db:
    container_name: db-locallibary
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_TEST}
      POSTGRES_USER: ${POSTGRES_USER_TEST}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST}
    volumes:
       - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app_libary:
    #build: .
    container_name: app-locallibary
    image: locallibary:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py test
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER_TEST}:${POSTGRES_PASSWORD_TEST}@db:5432/${POSTGRES_DB_TEST}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_TEST}
    ports:
      - "6060:8000"
    depends_on:
      - db
    restart: "no"
    

volumes:
  pgdata:




      # python manage.py migrate &&
      # python manage.py runserver


