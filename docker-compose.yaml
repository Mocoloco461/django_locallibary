services:
  db:
    container_name: db-locallibary
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
       - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  
  
  init-db:
    container_name: db-init
    image: locallibary:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        sleep 5 &&
        python manage.py migrate &&
        python manage.py collectstatic --no-input
      "
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    depends_on:
      - db
    restart: "no"

  
  app-libary:
    #build: .
    container_name: app-locallibary
    image: locallibary:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "
        gunicorn locallibary.wsgi:application --bind 0.0.0.0:8000
      "
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
    ports:
      - "6060:8000"
    depends_on:
      - db
      - init-db
  
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      
volumes:
  pgdata:
  
