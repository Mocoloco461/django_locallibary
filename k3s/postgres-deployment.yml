apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
    
      containers:
      - name: postgres
        image: postgres:15
        ports:
          - containerPort: 5432

        volumeMounts:
        - mountPath: "/var/lib/postgresql/data"
          name: postgres-volume

        env:
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                name: env
                key: POSTGRES_DB

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: env
                key: POSTGRES_USER
            
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: env
                key: POSTGRES_PASSWORD

    volumes:
    - name: postgres-volume
      persistentVolumeClaim:
        claimName: postgres-pvc