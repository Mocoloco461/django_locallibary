stages:
  - build_and_test
  - buid_and_run
  - push


test_via_django_tests:
  stage: build_and_test
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    - docker compose -f docker-compose-test.yaml up --build --exit-code-from app_libary
    - docker save -o locallibary.tar locallibary:latest
    
  artifacts:
    paths:
      - locallibary.tar
    expire_in: '1 hour'


