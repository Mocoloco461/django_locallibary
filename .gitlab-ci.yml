stages:
  - build
  - push


run_docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    - docker compose -f docker-compose-test.yaml up --build --exit-code-from app_libary
    - docker save -o locallibary.tar locallibary:latest
    - echo $?
    - ls
  artifacts:
    paths:
      - locallibary.tar
    expire_in: '1 hour'


push_image:
  stage: push
  image: alpine
  script:
    - ls #docker load -i locallibary.tar
  dependencies:
    - run_docker
