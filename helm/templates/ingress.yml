apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ (index .Values "app-ingress").metadata }}
  annotations:
    kubernetes.io/ingress.class: {{ (index .Values "app-ingress").annotations.volume }}
spec:
  rules:
  - http:        
      paths:
      - path: {{ (index .Values "app-ingress").spec.rules.http.paths.path }}
        pathType: {{ (index .Values "app-ingress").spec.rules.http.paths.pathType }}
        backend:
          service:
            name: {{ (index .Values "app-ingress").spec.rules.http.paths.backend.service.name }}
            port:
              number: {{ (index .Values "app-ingress").spec.rules.http.paths.backend.service.port.number }}
              