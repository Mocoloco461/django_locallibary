{{- $valuse := (index .Values "pgdata-deplyment") }}
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: {{ $valuse.name}}
  labels:
    app.kubernetes.io/{{ $valuse.labels}}: {{ $valuse.labels}}
spec:
  replicas: {{ $valuse.replicas}}
  selector:
    matchLabels:
      app.kubernetes.io/{{ $valuse.labels}}: {{ $valuse.labels}}
  template:
    metadata:
      labels:
        app.kubernetes.io/{{ $valuse.labels}}: {{ $valuse.labels}}
    spec:
    
      containers:
      {{- range $valuse.containers}}
      - name: {{ .name}}
        image: {{ .image}}
        ports:
        {{- range .ports}}
        - containerPort: {{ .containerPort}}
        {{- end }}
        volumeMounts:
        {{- range .volumeMounts}}
        - mountPath: {{ .mountPath }}
          name: {{ .name }}
        {{- end}}
        env:
          {{- toYaml .env | nindent 10}}
      {{- end}}

      volumes:
        {{- toYaml $valuse.volumes | nindent 8}}