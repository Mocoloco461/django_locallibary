{{- with index .Values "app-deployment"}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  labels:
    app.kubernetes.io/{{.metadata.labels.key}}: {{.metadata.labels.volume}}
spec:
  replicas: {{.spec.replicas}}
  selector:
    matchLabels:
      app.kubernetes.io/{{.spec.selector.matchLabels.key}}: {{.spec.selector.matchLabels.volume}}
  template:
    metadata:
      labels:
        app.kubernetes.io/{{.spec.template.metadata.labels.key}}: {{.spec.template.metadata.labels.volume}}
    spec:

      {{- with .spec.template.spec.initContiners }}    
      initContainers:
      - name: {{.name}}
        image: {{.image}}
        command: {{.command}}
        {{- end}}
        env:
        {{- range .spec.template.spec.initContainers.env }}
        - name: {{.name}}
          valueFrom: 
            secretKeyRef: 
              name: {{.valueFrom.secretKeyRef.name}}
              key: {{.valueFrom.secretKeyRef.key}}
        {{- end}}
              
      {{- with.spec.template.spec.containers }}
      containers:
      - name: {{.name}}
        image: {{.image}}        
        command: {{.command}}
        args:
          - {{.args}}
        ports:
        - containerPort: {{$.spec.template.spec.containers.ports.containerPort}}
        {{- end}}

        env:
          - name: DATABASE_URL
            valueFrom: 
              secretKeyRef:
                name: env
                key: DATABASE_URL

          - name: DJANGO_SECRET_KEY
            valueFrom: 
              secretKeyRef:
                name: env
                key: DJANGO_SECRET_KEY
{{- end}}