apiVersion: v1
kind: Secret
metadata:
  name: {{.Values.secrets.metadata.name}}
  namespace: {{.Values.secrets.metadata.namespace}}
type: {{.Values.secrets.type}}
stringData:  
  POSTGRES_DB: {{.Values.secrets.stringData.POSTGRES_DB}} 
  POSTGRES_USER: {{.Values.secrets.stringData.POSTGRES_USER}}
  POSTGRES_PASSWORD: {{.Values.secrets.stringData.POSTGRES_PASSWORD}}
  DATABASE_URL: {{.Values.secrets.stringData.DATABASE_URL}}
  DJANGO_SECRET_KEY: {{.Values.secrets.stringData.DJANGO_SECRET_KEY}}
  DJANGO_DEBUG: {{.Values.secrets.stringData.DJANGO_DEBUG}}

